name: Infra plan (what-if)

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  what-if:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep what-if
        run: |
          set -o pipefail
          az deployment group what-if \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/main.dev.bicepparam \
            --no-pretty-print | tee /tmp/whatif.txt

      - name: Comment plan on PR
        if: always()
        run: |
          {
            echo "### Bicep what-if"
            echo '```'
            tail -c 40000 /tmp/whatif.txt
            echo '```'
          } > /tmp/whatif-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/whatif-comment.md
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
