name: Deploy and verify

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v4

      # Static content only — the API is a separately-deployed Function App linked as this SWA's
      # backend (see infra/modules/staticWebApp.bicep). SWA's own "managed Functions" build/deploy
      # path has an open platform-side bug as of this writing; this sidesteps it entirely.
      - name: Deploy static content to Azure Static Web Apps
        id: deploy
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist

  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      function_app_name: ${{ steps.find-app.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find the Function App name
        id: find-app
        run: |
          NAME=$(az functionapp list --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --query "[0].name" -o tsv)
          if [ -z "$NAME" ]; then
            echo "No Function App found in ${{ secrets.AZURE_RESOURCE_GROUP }} — has infra-apply.yml been run?" >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.find-app.outputs.name }}
          package: backend
          scm-do-build-during-deployment: true
          enable-oryx-build: true

  verify:
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Health-check the deployed app
        id: health
        run: |
          URL="${{ needs.deploy-frontend.outputs.url }}"
          echo "Checking $URL/api/health"
          for attempt in 1 2 3; do
            if curl -fsS --max-time 15 "$URL/api/health" | grep -q '"status":"ok"'; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $attempt failed, waiting for propagation..."
            sleep 30
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Deploy-verify agent (only runs on health-check failure)
        if: steps.health.outputs.ok != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            DEPLOYED URL: ${{ needs.deploy-frontend.outputs.url }}
            FUNCTION APP: ${{ needs.deploy-backend.outputs.function_app_name }}
            MERGE COMMIT: ${{ github.sha }}

            The deployment to Azure for this merge to main failed its health check
            (GET /api/health on the Static Web App, proxied to the linked Function App, did not
            return {"status":"ok"} after retries).

            You are the deploy-verify agent. You cannot edit any source files. Your only two
            possible actions:
            1. If this looks like a real regression from this merge, run
               `git revert --no-edit ${{ github.sha }}` and push it directly to main
               (`git push origin HEAD:main`), then open an issue with `gh issue create`
               summarizing the failure and linking the revert commit.
            2. If you cannot determine the cause with confidence, do not revert — instead open
               an issue with `gh issue create` describing what you observed (curl output, any
               logs you can reach) so a human can investigate.

            Prefer option 2 unless you are confident the revert is correct and safe.

          claude_args: |
            --max-turns 8
            --allowedTools "Bash(curl:*),Bash(git revert:*),Bash(git push:*),Bash(gh issue create:*)"
            --disallowedTools "Edit,Write,NotebookEditCell"

      - name: Fail the job if unhealthy
        if: steps.health.outputs.ok != 'true'
        run: |
          echo "Deployment failed health check; see the deploy-verify agent's actions above."
          exit 1
