name: Agent - design review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: design-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the design-reviewer agent for this repository (see CLAUDE.md and
            plans/architecture.md for the architecture and conventions).

            Review this PR's diff for:
            - Whether it matches the repo's architecture (frontend/backend/infra separation,
              service module boundaries in backend/app/services/, frontend component structure).
            - Whether the POST /api/trip-plan request/response contract (backend/app/schemas.py)
              and frontend/src/types/tripPlan.ts stay in sync if either changed.
            - Obvious scope creep, unused code, or missing test coverage for new logic.
            - Secrets or credentials committed in plain text.

            Start with `gh pr diff` to read the whole diff in one call. Only fall back to
            reading individual files (Read/Glob/Grep) for context you can't get from the diff
            alone (e.g. checking whether a changed function is still referenced elsewhere) —
            you have a limited turn budget, so don't Read every changed file up front.

            This is an advisory review only. You are NOT allowed to edit any files or push
            commits. Post a single top-level summary via `gh pr comment`, and use
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for
            specific line-level issues. If you find nothing concerning, post a short comment
            saying so rather than staying silent.

          claude_args: |
            --max-turns 20
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,Write,NotebookEditCell"
