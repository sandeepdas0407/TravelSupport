name: Infra apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which parameter file to apply (dev or prod)"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    # Configure a "production" (and optionally "dev") GitHub Environment with required reviewers
    # in repo settings — this is the manual-approval gate. Deliberately not part of the agentic
    # loop: infra apply has too much blast radius (resource create/delete, cost) to automate.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/main.${{ inputs.environment }}.bicepparam \
            --parameters anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
            --parameters googlePlacesApiKey="${{ secrets.GOOGLE_PLACES_API_KEY }}"
